<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardian - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body>
    <div class="l-app-shell">
        <header class="l-header">
            <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.5); backdrop-filter:blur(4px); padding:4px 14px 4px 4px; border-radius:999px; border:1px solid rgba(0,0,0,0.06);">
                <label style="cursor:pointer; display:flex;" title="Profilbild ändern">
                    <img id="user-avatar" src="assets/logo.png" alt="Profilbild" style="height:34px; width:34px; border-radius:50%; object-fit:cover; border:2px solid var(--primary-light); box-shadow:0 0 0 1px rgba(0,0,0,0.05);">
                    <input type="file" id="avatar-upload" accept="image/*" style="display:none;">
                </label>
                <span id="user-name" style="font-size:0.82rem; font-weight:600; color:var(--text-main);"></span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; display:flex; align-items:center;">
                <img src="assets/logo.png" alt="Gardian" style="height:38px; width:38px; border-radius:50%; object-fit:cover;">
                <h1 style="font-size:1.5rem; color:var(--primary-dark);">Gardian</h1>
            </div>
            <button class="c-btn c-btn--text" onclick="logout()" style="font-size:0.8rem;">Abmelden</button>
        </header>

        <div class="l-app-body">
            <aside class="l-sidebar">
                <div class="c-form-group">
                    <label class="c-label">Menü</label>
                    <nav style="display: flex; flex-direction: column; gap: 4px;">
                        <button id="nav-dashboard" class="c-btn c-btn--secondary" style="justify-content: flex-start;" onclick="showView('dashboard')">Gartenkarte</button>
                        <button id="nav-pflanzen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('pflanzen')">Pflanzen</button>
                        <button id="nav-galerie" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('galerie')">Galerie</button>
                        <a id="nav-tabelle" href="tabelle.html?fx=nav-tabelle" class="c-btn c-btn--text" style="justify-content: flex-start; text-decoration:none;">Tabelle</a>
                        <a id="nav-kalender" href="kalender.html?fx=nav-kalender" class="c-btn c-btn--text" style="justify-content: flex-start; text-decoration:none;">Gartenkalender</a>
                        <button id="nav-einstellungen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('einstellungen')">Einstellungen</button>
                        <button id="nav-admin" class="c-btn c-btn--text" style="justify-content: flex-start; display:none; color: var(--danger);" onclick="showView('admin')">Admin</button>
                    </nav>
                </div>
                <hr style="border:none; border-top:1px solid var(--border); margin:8px 0;">
                <div class="c-form-group">
                    <label class="c-label">Filter</label>
                    <nav style="display:flex; flex-direction:column; gap:4px;">
                        <!-- Typ Dropdown -->
                        <div class="filter-accordion">
                            <button class="c-btn c-btn--text" style="justify-content:space-between; width:100%;" onclick="toggleFilterAccordion(this)">
                                Typ <span class="filter-accordion__arrow">▾</span>
                            </button>
                            <div class="filter-accordion__body" id="filter-types" style="display:flex; flex-direction:column; gap:0; padding:2px 0 4px 12px;">
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:2px;font-weight:600;"><input type="checkbox" id="filter-types-all" checked onchange="toggleAllTypes(this)"> Alle</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="tree"> Baum</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="shrub"> Strauch</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="flower"> Blume</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="s_flower"> Blümchen</label>
                            </div>
                        </div>
                        <!-- Aufgaben Filter -->
                        <div class="filter-accordion">
                            <button class="c-btn c-btn--text" style="justify-content:space-between; width:100%;" onclick="toggleFilterAccordion(this)">
                                Aufgaben <span class="filter-accordion__arrow">▾</span>
                            </button>
                            <div class="filter-accordion__body" style="display:flex; flex-direction:column; gap:6px; padding:4px 0 6px 12px;">
                                <!-- Monatsauswahl (Multi-Toggle) -->
                                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;" id="sidebar-care-months">
                                    <button id="sidebar-care-all-btn" onclick="setAllCareMonths()" style="grid-column:1/-1;padding:4px 2px;border-radius:6px;border:1px solid var(--primary);font-size:0.72rem;font-weight:700;cursor:pointer;background:var(--primary);color:white;font-family:inherit;text-align:center;">Alle</button>
                                    <button class="sidebar-care-month-btn" data-month="0"  onclick="toggleCareMonth(0)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Jan</button>
                                    <button class="sidebar-care-month-btn" data-month="1"  onclick="toggleCareMonth(1)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Feb</button>
                                    <button class="sidebar-care-month-btn" data-month="2"  onclick="toggleCareMonth(2)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Mär</button>
                                    <button class="sidebar-care-month-btn" data-month="3"  onclick="toggleCareMonth(3)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Apr</button>
                                    <button class="sidebar-care-month-btn" data-month="4"  onclick="toggleCareMonth(4)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Mai</button>
                                    <button class="sidebar-care-month-btn" data-month="5"  onclick="toggleCareMonth(5)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Jun</button>
                                    <button class="sidebar-care-month-btn" data-month="6"  onclick="toggleCareMonth(6)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Jul</button>
                                    <button class="sidebar-care-month-btn" data-month="7"  onclick="toggleCareMonth(7)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Aug</button>
                                    <button class="sidebar-care-month-btn" data-month="8"  onclick="toggleCareMonth(8)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Sep</button>
                                    <button class="sidebar-care-month-btn" data-month="9"  onclick="toggleCareMonth(9)"  style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Okt</button>
                                    <button class="sidebar-care-month-btn" data-month="10" onclick="toggleCareMonth(10)" style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Nov</button>
                                    <button class="sidebar-care-month-btn" data-month="11" onclick="toggleCareMonth(11)" style="padding:4px 2px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;cursor:pointer;background:var(--bg-app);color:var(--text-main);font-family:inherit;text-align:center;">Dez</button>
                                </div>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;">
                                    <input type="checkbox" id="filter-care-active" onchange="setCareFilterActive(this.checked)" style="accent-color:var(--primary);">
                                    Pflanzen ohne Aufgaben ausblenden
                                </label>
                            </div>
                        </div>

                        <!-- Gruppen Dropdown -->
                        <div class="filter-accordion">
                            <button class="c-btn c-btn--text" style="justify-content:space-between; width:100%;" onclick="toggleFilterAccordion(this)">
                                Pflanzengruppen <span class="filter-accordion__arrow">▾</span>
                            </button>
                            <div class="filter-accordion__body" id="filter-groups" style="display:flex; flex-direction:column; gap:0; padding:2px 0 4px 12px;"></div>
                        </div>
                    </nav>
                </div>
            </aside>

            <main class="l-main-content">

                <!-- View: Pflanzen -->
                <div id="view-pflanzen" style="display: none; padding: 32px; overflow-y: auto;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Meine Pflanzen</h2>
                        </div>
                        <div class="c-card__body">
                            <div id="pflanzen-liste"></div>
                        </div>
                    </div>
                </div>

                <!-- View: Galerie -->
                <div id="view-galerie" style="display: none; height: 100%; overflow-y: auto; background:#0f172a;">
                    <div style="padding:24px 28px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
                        <h2 style="font-size:1.5rem; font-weight:800; color:#a3e635; margin:0;">Gartengalerie</h2>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <select id="galerie-sort" onchange="renderGalerie()" style="padding:6px 10px; border-radius:var(--radius-md); border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:white; font-size:0.85rem; cursor:pointer;">
                                <option value="name">Nach Name</option>
                                <option value="type">Nach Kategorie</option>
                            </select>
                            <button onclick="renderGalerie()" title="Aktualisieren" style="background:none; border:none; font-size:1.3rem; cursor:pointer; transition:transform 0.4s;" onmouseover="this.style.transform='rotate(180deg)'" onmouseout="this.style.transform=''">🔄</button>
                        </div>
                    </div>
                    <div id="galerie-grid" style="columns:4; column-gap:16px; padding:24px;"></div>
                </div>

                <!-- View: Admin -->
                <div id="view-admin" style="display: none; padding: 32px; overflow-y: auto;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Administration</h2>
                        </div>
                        <div class="c-card__body">
                            <div style="display:flex; gap:8px; margin-bottom:20px;">
                                <button id="admin-tab-users"      class="c-btn c-btn--secondary" onclick="switchAdminTab('users')">Benutzer</button>
                                <button id="admin-tab-groups"     class="c-btn c-btn--text"      onclick="switchAdminTab('groups')">Pflanzengruppen</button>
                                <button id="admin-tab-care-types" class="c-btn c-btn--text"      onclick="switchAdminTab('care-types')">Aufgaben-Typen</button>
                                <button id="admin-tab-icons"      class="c-btn c-btn--text"      onclick="switchAdminTab('icons')">Icon-Bibliothek</button>
                            </div>
                            <div id="admin-panel-users"></div>
                            <div id="admin-panel-groups"     style="display:none;"></div>
                            <div id="admin-panel-care-types" style="display:none;"></div>
                            <div id="admin-panel-icons"      style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <!-- View: Einstellungen -->
                <div id="view-einstellungen" style="display: none; padding: 24px; overflow-y: auto;" class="view-einstellungen">
                    <div class="settings-grid" style="max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));">
                        
                        <!-- Profil (Links) -->
                        <div class="c-card">
                            <div class="c-card__header">
                                <h2 class="c-card__title">👤 Profil</h2>
                            </div>
                            <div class="c-card__body">
                                <div style="display:flex; align-items:center; gap:16px; margin-bottom: 24px;">
                                    <label style="cursor:pointer; position:relative;" title="Profilbild ändern">
                                        <img id="settings-avatar" src="assets/logo.png" alt="Profilbild"
                                            style="width:68px; height:68px; border-radius:50%; object-fit:cover; border:2px solid var(--border);">
                                        <div style="position:absolute;bottom:0;right:0;background:var(--primary);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;">✎</div>
                                        <input type="file" id="settings-avatar-upload" accept="image/*" style="display:none;">
                                    </label>
                                    <div>
                                        <div id="settings-username" style="font-weight:700; font-size:1.1rem;"></div>
                                        <div id="settings-email" style="color:var(--text-muted); font-size:0.9rem;"></div>
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                                    <div class="c-form-group">
                                        <label class="c-label">E-Mail</label>
                                        <input type="email" id="settings-new-email" class="c-input" placeholder="Neue E-Mail">
                                    </div>
                                    <div class="c-form-group">
                                        <label class="c-label">Passwort</label>
                                        <input type="password" id="settings-new-password" class="c-input" placeholder="••••••••">
                                    </div>
                                </div>
                                <div style="flex: 1;"></div>
                                <button class="c-btn c-btn--primary" onclick="settingsSaveProfile()" style="width: 100%; height: 44px; font-weight: 700;">Speichern</button>
                            </div>
                        </div>

                        <!-- Erscheinungsbild (Rechts) -->
                        <div class="c-card">
                            <div class="c-card__header">
                                <h2 class="c-card__title">🎨 Design</h2>
                            </div>
                            <div class="c-card__body">
                                <div style="font-weight:700; font-size:0.75rem; margin-bottom:12px; color: var(--text-muted); letter-spacing: 0.05em;">THEME WÄHLEN</div>
                                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 24px;">
                                    <!-- Light -->
                                    <div onclick="setTheme('light')" id="theme-opt-light" class="c-theme-tile">
                                        <div class="c-theme-tile__preview" style="background:#F5F7FA;">
                                            <div style="height:8px; background:#4CAF50; border-radius:2px;"></div>
                                            <div style="height:6px; background:#e2e8f0; border-radius:2px; width:80%;"></div>
                                        </div>
                                        <div class="c-theme-tile__label">Hell</div>
                                    </div>
                                    <!-- Dark -->
                                    <div onclick="setTheme('dark')" id="theme-opt-dark" class="c-theme-tile">
                                        <div class="c-theme-tile__preview" style="background:#1A202C;">
                                            <div style="height:8px; background:#81C784; border-radius:2px;"></div>
                                            <div style="height:6px; background:#2D3748; border-radius:2px; width:80%;"></div>
                                        </div>
                                        <div class="c-theme-tile__label">Dunkel</div>
                                    </div>
                                    <!-- Unicorn -->
                                    <div onclick="setTheme('unicorn')" id="theme-opt-unicorn" class="c-theme-tile">
                                        <div class="c-theme-tile__preview" style="background:linear-gradient(120deg,#fce7f3,#cffafe,#fef9c3,#e9d5ff);">
                                            <div style="height:8px; background:rgba(217,70,239,0.7); border-radius:2px;"></div>
                                            <div style="height:6px; background:rgba(255,255,255,0.6); border-radius:2px; width:80%;"></div>
                                        </div>
                                        <div class="c-theme-tile__label">Unicorn</div>
                                    </div>
                                </div>
                                
                                <div style="flex: 1;"></div>
                                <div style="padding-top:20px; border-top:1px solid var(--border);">
                                    <label class="c-switch">
                                        <input type="checkbox" id="settings-effects-toggle" class="c-switch__input" onchange="setEffectsEnabled(this.checked)">
                                        <div class="c-switch__track">
                                            <div class="c-switch__handle"></div>
                                        </div>
                                        <div style="display:flex; flex-direction:column;">
                                            <span style="font-weight:600; font-size:0.95rem;">Interaktionseffekte</span>
                                            <span style="font-size:0.8rem; color:var(--text-muted); line-height: 1.2;">Animationen & Konfetti</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- View: Dashboard (Karte) -->
                <div id="view-dashboard" style="flex-direction:column; height:100%; gap:0;">

                    <!-- Blütezeit-Slider -->
                    <div id="bloom-slider" style="background:var(--bg-card); border-bottom:1px solid var(--border); padding:8px 16px 8px 8px; display:flex; align-items:center; gap:10px; white-space:nowrap; flex-shrink:0;">
                        <button id="btn-zoom-width" onclick="zoomFitWidth()" title="Auf Breite anpassen" style="display:none; padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">↔ Breite</button>
                        <button id="btn-zoom-height" onclick="zoomFitHeight()" title="Auf Höhe anpassen" style="display:none; padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">↕ Höhe</button>
                        <div id="zoom-btn-separator" style="display:none; width:1px; height:22px; background:var(--border); margin:0 0; flex-shrink:0;"></div>
                        <button onclick="setBloomAll()" id="bloom-btn-all" class="c-btn c-btn--primary" style="font-size:0.8rem; padding:5px 12px;">Alle</button>
                        <div style="display:flex; gap:4px;" id="bloom-year-tabs">
                            <button onclick="setBloomYear('std')" data-bloom-year="std" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">Standard</button>
                            <button onclick="setBloomYear(2025)" data-bloom-year="2025" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2025</button>
                            <button onclick="setBloomYear(2026)" data-bloom-year="2026" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2026</button>
                            <button onclick="setBloomYear(2027)" data-bloom-year="2027" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2027</button>
                            <button onclick="setBloomYear(2028)" data-bloom-year="2028" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2028</button>
                            <button onclick="setBloomYear(2029)" data-bloom-year="2029" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2029</button>
                            <button onclick="setBloomYear(2030)" data-bloom-year="2030" class="bloom-year-btn" style="padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2030</button>
                        </div>
                        <!-- Hover-Controls -->
                        <div style="width:1px; height:22px; background:var(--border); margin:0 4px; flex-shrink:0;"></div>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:0.8rem; user-select:none; flex-shrink:0;">
                            <input type="checkbox" id="hover-gallery-toggle" checked onchange="setHoverGallery(this.checked)" style="accent-color:var(--primary); cursor:pointer;">
                            Hover-Galerie
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:0.8rem; user-select:none; flex-shrink:0;">
                            <input type="checkbox" id="hover-lock-toggle" onchange="setHoverLock(this.checked)" style="accent-color:var(--primary); cursor:pointer;">
                            Hover-Sperre
                        </label>
                        <!-- Pflege-Layer Toggle -->
                        <div style="width:1px; height:22px; background:var(--border); margin:0 4px; flex-shrink:0;"></div>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:0.8rem; user-select:none; flex-shrink:0;">
                            <input type="checkbox" id="care-overlay-toggle" onchange="toggleCareOverlay(this.checked)" style="accent-color:var(--primary); cursor:pointer;">
                            Pflege-Badges
                        </label>

                        <div id="hover-size-controls" style="display:flex; gap:3px; flex-shrink:0;">
                            <button onclick="setHoverSize('S')" data-size="S" class="hover-size-btn" style="padding:3px 8px; border-radius:20px; border:1px solid var(--border); font-size:0.75rem; font-weight:600; cursor:pointer; background:var(--bg-app); color:var(--text-main);">S</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const m = new Date().getMonth();
            setCareOverlayMonth(m);  // Overlay-Leiste
            setCareFilterMonth(m);   // Sidebar
        });
    </script>
    <script>
        // Avatar + Rolle laden
        async function loadAvatar() {
            const res = await fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'getAvatar' })
            });
            const data = await res.json();
            if (data.success && data.avatar) {
                document.getElementById('user-avatar').src = data.avatar + '?t=' + Date.now();
            }
            if (data.username) {
                document.getElementById('user-name').textContent = data.username;
            }
            if (data.role === 'admin') {
                document.getElementById('nav-admin').style.display = 'flex';
            }

            // NEU: Konfiguration (Theme + Effekte) beim Start laden
            const configRes = await fetch('backend/api.php', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'getGardenConfig' }) });
            const configData = await configRes.json();
            if (configData.success && configData.config) {
                const c = configData.config;
                if (c.theme) document.documentElement.setAttribute('data-theme', c.theme);
                const effectsToggle = document.getElementById('settings-effects-toggle');
                if (effectsToggle) effectsToggle.checked = parseInt(c.effects_enabled) !== 0;
                updateSettingsThemeBtn();
                
                // NEU: Animation-Trigger aus URL prüfen
                if (typeof EffectManager !== 'undefined') EffectManager.initFromUrl();
            }
        }

        // Avatar Upload
        let cropper = null;
        const cropModal = document.getElementById('modal-avatar-crop');
        const cropImg   = document.getElementById('avatar-crop-image');

        function openCropModal(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                cropImg.src = e.target.result;
                cropModal.style.display = 'flex';
                if (cropper) cropper.destroy();
                cropper = new Cropper(cropImg, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 1,
                    restore: false,
                    guides: false,
                    center: true,
                    highlight: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    toggleDragModeOnDblclick: false,
                    minContainerHeight: 300
                });
            };
            reader.readAsDataURL(file);
        }

        function closeCropModal() {
            cropModal.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        async function saveCroppedAvatar() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('action', 'uploadAvatar');
                formData.append('avatar', blob, 'avatar.png');
                const res = await fetch('backend/api.php', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    const avatarUrl = data.avatar + '?t=' + Date.now();
                    document.getElementById('user-avatar').src = avatarUrl;
                    const settingsAv = document.getElementById('settings-avatar');
                    if (settingsAv) settingsAv.src = avatarUrl;
                    closeCropModal();
                }
            }, 'image/png');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAvatar();
            // Verwaiste Bilder still im Hintergrund bereinigen
            fetch('backend/api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'cleanupImages' }) });
            // View aus URL-Hash laden (z.B. index.html#einstellungen)
            const hash = location.hash.replace('#', '');
            if (hash && views.includes(hash)) showView(hash);

            document.getElementById('avatar-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) openCropModal(file);
                e.target.value = ''; // Reset input
            });

            const settingsAvUpload = document.getElementById('settings-avatar-upload');
            if (settingsAvUpload) {
                settingsAvUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) openCropModal(file);
                    e.target.value = ''; // Reset input
                });
            }
        });

        const views = ['dashboard', 'pflanzen', 'galerie', 'einstellungen', 'admin'];

        function showView(name) {
            views.forEach(v => {
                const viewEl = document.getElementById('view-' + v);
                const navEl  = document.getElementById('nav-' + v);
                if (viewEl) viewEl.style.display = v === name ? (v === 'dashboard' ? 'flex' : 'block') : 'none';
                if (navEl) {
                    navEl.className = 'c-btn ' + (v === name ? 'c-btn--secondary' : 'c-btn--text');
                    navEl.style.justifyContent = 'flex-start';
                }
            });

            // Trigger interaction effect
            if (typeof EffectManager !== 'undefined') {
                const navBtn = document.getElementById('nav-' + name);
                EffectManager.trigger('sidebar-click', navBtn);
            }

            if (name === 'pflanzen') loadPflanzenListe();
            if (name === 'galerie') loadGalerie();
            if (name === 'admin') loadAdminView();
            if (name === 'einstellungen') loadEinstellungen();
        }

        async function logout() {
            await fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' })
            });
            location.href = 'login.html';
        }

        async function loadEinstellungen() {
            const res  = await fetch('backend/api.php', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'getUser' }) });
            const data = await res.json();
            if (!data.success) return;
            const u = data.user;
            document.getElementById('settings-username').textContent = u.username || '';
            document.getElementById('settings-email').textContent    = u.email    || '';
            if (u.avatar_path) document.getElementById('settings-avatar').src = u.avatar_path + '?t=' + Date.now();
            
            updateSettingsThemeBtn();
        }

        function updateSettingsThemeBtn() {
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            ['light','dark','unicorn'].forEach(t => {
                const el = document.getElementById('theme-opt-' + t);
                if (el) el.style.borderColor = t === theme ? 'var(--primary)' : 'transparent';
            });
        }

        async function settingsSaveProfile() {
            const email    = document.getElementById('settings-new-email').value.trim();
            const password = document.getElementById('settings-new-password').value.trim();
            
            if (!email && !password) {
                alert('Gespeichert.'); // Provide feedback even if only avatar was changed visually
                return;
            }
            
            const res  = await fetch('backend/api.php', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'updateUser', email: email||null, password: password||null }) });
            const data = await res.json();
            if (data.success) {
                document.getElementById('settings-new-password').value = '';
                if (email) { document.getElementById('settings-email').textContent = email; document.getElementById('settings-new-email').value = ''; }
                alert('Gespeichert.');
                if (typeof EffectManager !== 'undefined') EffectManager.trigger('save-success');
            }
        }


        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            updateSettingsThemeBtn();
            fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'saveGardenConfig', theme })
            });
        }

        function setEffectsEnabled(enabled) {
            fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'saveGardenConfig', effects_enabled: enabled ? 1 : 0 })
            });
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(current === 'light' ? 'dark' : 'light');
        }
    </script>
