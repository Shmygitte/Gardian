<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardian - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
    <div class="l-app-shell">
        <header class="l-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="assets/logo.png" alt="Logo" style="height: 40px; border-radius: 50%;">
                <h1 style="font-size: 1.5rem; color: var(--primary-dark);">Gardian</h1>
            </div>
            <nav class="c-nav">
                <!-- Navigation items would go here -->
                <button class="c-btn c-btn--text" onclick="logout()">Abmelden</button>
            </nav>
        </header>

        <div class="l-app-body">
            <aside class="l-sidebar">
                <div class="c-form-group">
                    <label class="c-label">Menü</label>
                    <nav style="display: flex; flex-direction: column; gap: 8px;">
                        <button id="nav-dashboard" class="c-btn c-btn--secondary" style="justify-content: flex-start;" onclick="showView('dashboard')">Dashboard</button>
                        <button id="nav-pflanzen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('pflanzen')">Pflanzen</button>
                        <button id="nav-einstellungen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('einstellungen')">Einstellungen</button>
                    </nav>
                </div>
            </aside>

            <main class="l-main-content">

                <!-- View: Pflanzen -->
                <div id="view-pflanzen" style="display: none; padding: 32px;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Pflanzen</h2>
                        </div>
                        <div class="c-card__body">
                            Dieser Bereich wird in Kürze verfügbar sein.
                        </div>
                    </div>
                </div>

                <!-- View: Einstellungen -->
                <div id="view-einstellungen" style="display: none; padding: 32px;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Einstellungen</h2>
                        </div>
                        <div class="c-card__body">
                            Dieser Bereich wird in Kürze verfügbar sein.
                        </div>
                    </div>
                </div>

                <!-- View: Dashboard (Karte) -->
                <div id="view-dashboard" class="map" style="position: relative;">
                    <div class="map__canvas" style="width: 100%; height: 100%; overflow: hidden; position: relative; cursor: default;"></div>
                    <div id="map-controls" class="map__controls" style="position: absolute; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px;">
                        <label class="c-btn c-btn--secondary" style="cursor: pointer;">
                            Karte hochladen
                            <input type="file" id="map-upload-input" accept="image/*" style="display: none;">
                        </label>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="src/js/app.js"></script>
    <script>
        const views = ['dashboard', 'pflanzen', 'einstellungen'];

        function showView(name) {
            views.forEach(v => {
                document.getElementById('view-' + v).style.display = v === name ? (v === 'dashboard' ? 'flex' : 'block') : 'none';
                const btn = document.getElementById('nav-' + v);
                btn.className = 'c-btn ' + (v === name ? 'c-btn--secondary' : 'c-btn--text');
            });
        }

        async function logout() {
            await fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' })
            });
            location.href = 'login.html';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>
