<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardian - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
    <div class="l-app-shell">
        <header class="l-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label style="cursor: pointer;" title="Profilbild ändern">
                    <img id="user-avatar" src="assets/logo.png" alt="Profilbild" style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover;">
                    <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                </label>
                <h1 style="font-size: 1.5rem; color: var(--primary-dark);">Gardian</h1>
            </div>
            <nav class="c-nav">
                <!-- Navigation items would go here -->
                <button class="c-btn c-btn--text" onclick="logout()">Abmelden</button>
            </nav>
        </header>

        <div class="l-app-body">
            <aside class="l-sidebar">
                <div class="c-form-group">
                    <label class="c-label">Menü</label>
                    <nav style="display: flex; flex-direction: column; gap: 8px;">
                        <button id="nav-dashboard" class="c-btn c-btn--secondary" style="justify-content: flex-start;" onclick="showView('dashboard')">Gartenkarte</button>
                        <button id="nav-pflanzen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('pflanzen')">Pflanzen</button>
                        <button id="nav-einstellungen" class="c-btn c-btn--text" style="justify-content: flex-start;" onclick="showView('einstellungen')">Einstellungen</button>
                        <button id="nav-admin" class="c-btn c-btn--text" style="justify-content: flex-start; display:none; color: var(--danger);" onclick="showView('admin')">Admin</button>
                    </nav>
                </div>
                <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
                <div class="c-form-group">
                    <label class="c-label">Filter</label>
                    <nav style="display:flex; flex-direction:column; gap:8px;">
                        <!-- Typ Dropdown -->
                        <div class="filter-accordion">
                            <button class="c-btn c-btn--text" style="justify-content:space-between; width:100%;" onclick="toggleFilterAccordion(this)">
                                Typ <span class="filter-accordion__arrow">▾</span>
                            </button>
                            <div class="filter-accordion__body" id="filter-types" style="display:flex; flex-direction:column; gap:0; padding:2px 0 4px 12px;">
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:2px;font-weight:600;"><input type="checkbox" id="filter-types-all" checked onchange="toggleAllTypes(this)"> Alle</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="tree">     🌳 Baum</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="shrub">    🌿 Strauch</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="flower">   🌸 Blume</label>
                                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;padding:3px 0;"><input type="checkbox" checked onchange="syncAllTypes();applyFilter()" data-type="s_flower"> 🌼 Saisonblume</label>
                            </div>
                        </div>
                        <!-- Gruppen Dropdown -->
                        <div class="filter-accordion">
                            <button class="c-btn c-btn--text" style="justify-content:space-between; width:100%;" onclick="toggleFilterAccordion(this)">
                                Pflanzengruppen <span class="filter-accordion__arrow">▾</span>
                            </button>
                            <div class="filter-accordion__body" id="filter-groups" style="display:flex; flex-direction:column; gap:0; padding:2px 0 4px 12px;"></div>
                        </div>
                    </nav>
                </div>
            </aside>

            <main class="l-main-content">

                <!-- View: Pflanzen -->
                <div id="view-pflanzen" style="display: none; padding: 32px; overflow-y: auto;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Meine Pflanzen</h2>
                        </div>
                        <div class="c-card__body">
                            <div id="pflanzen-liste"></div>
                        </div>
                    </div>
                </div>

                <!-- View: Admin -->
                <div id="view-admin" style="display: none; padding: 32px; overflow-y: auto;">
                    <div class="c-card">
                        <div class="c-card__header">
                            <h2 class="c-card__title">Administration</h2>
                        </div>
                        <div class="c-card__body">
                            <div style="display:flex; gap:8px; margin-bottom:20px;">
                                <button id="admin-tab-users" class="c-btn c-btn--secondary" onclick="switchAdminTab('users')">Benutzer</button>
                                <button id="admin-tab-groups" class="c-btn c-btn--text" onclick="switchAdminTab('groups')">Pflanzengruppen</button>
                            </div>
                            <div id="admin-panel-users"></div>
                            <div id="admin-panel-groups" style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <!-- View: Einstellungen -->
                <div id="view-einstellungen" style="display: none; padding: 32px; overflow-y: auto;">
                    <div style="max-width:600px; display:flex; flex-direction:column; gap:20px;">

                        <!-- Profil -->
                        <div class="c-card">
                            <div class="c-card__header">
                                <h2 class="c-card__title">Profil</h2>
                            </div>
                            <div class="c-card__body" style="display:flex; flex-direction:column; gap:16px;">
                                <div style="display:flex; align-items:center; gap:16px;">
                                    <label style="cursor:pointer; position:relative;" title="Profilbild ändern">
                                        <img id="settings-avatar" src="assets/logo.png" alt="Profilbild"
                                            style="width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid var(--border);">
                                        <div style="position:absolute;bottom:0;right:0;background:var(--primary);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;">✎</div>
                                        <input type="file" id="settings-avatar-upload" accept="image/*" style="display:none;" onchange="settingsUploadAvatar(this)">
                                    </label>
                                    <div>
                                        <div id="settings-username" style="font-weight:700; font-size:1.1rem;"></div>
                                        <div id="settings-email" style="color:var(--text-muted); font-size:0.9rem;"></div>
                                    </div>
                                </div>
                                <div class="c-form-group">
                                    <label class="c-label">E-Mail ändern</label>
                                    <input type="email" id="settings-new-email" class="c-input" placeholder="Neue E-Mail-Adresse">
                                </div>
                                <div class="c-form-group">
                                    <label class="c-label">Neues Passwort</label>
                                    <input type="password" id="settings-new-password" class="c-input" placeholder="Leer lassen = nicht ändern">
                                </div>
                                <div>
                                    <button class="c-btn c-btn--primary" onclick="settingsSaveProfile()">Speichern</button>
                                </div>
                            </div>
                        </div>

                        <!-- Erscheinungsbild -->
                        <div class="c-card">
                            <div class="c-card__header">
                                <h2 class="c-card__title">Erscheinungsbild</h2>
                            </div>
                            <div class="c-card__body">
                                <div style="font-weight:600; margin-bottom:12px;">Theme</div>
                                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                                    <div onclick="setTheme('light')" id="theme-opt-light" style="cursor:pointer; border-radius:var(--radius-md); overflow:hidden; border:3px solid transparent; transition:border-color 0.2s;">
                                        <div style="width:120px; height:80px; background:#F5F7FA; border-radius:10px; padding:8px; box-sizing:border-box;">
                                            <div style="height:12px; background:#4CAF50; border-radius:4px; margin-bottom:6px;"></div>
                                            <div style="height:8px; background:#e2e8f0; border-radius:3px; margin-bottom:4px;"></div>
                                            <div style="height:8px; background:#e2e8f0; border-radius:3px; width:70%;"></div>
                                        </div>
                                        <div style="text-align:center; font-size:0.8rem; font-weight:600; padding:4px 0;">☀️ Hell</div>
                                    </div>
                                    <div onclick="setTheme('dark')" id="theme-opt-dark" style="cursor:pointer; border-radius:var(--radius-md); overflow:hidden; border:3px solid transparent; transition:border-color 0.2s;">
                                        <div style="width:120px; height:80px; background:#1A202C; border-radius:10px; padding:8px; box-sizing:border-box;">
                                            <div style="height:12px; background:#81C784; border-radius:4px; margin-bottom:6px;"></div>
                                            <div style="height:8px; background:#2D3748; border-radius:3px; margin-bottom:4px;"></div>
                                            <div style="height:8px; background:#2D3748; border-radius:3px; width:70%;"></div>
                                        </div>
                                        <div style="text-align:center; font-size:0.8rem; font-weight:600; padding:4px 0;">🌙 Dunkel</div>
                                    </div>
                                    <div onclick="setTheme('unicorn')" id="theme-opt-unicorn" style="cursor:pointer; border-radius:var(--radius-md); overflow:hidden; border:3px solid transparent; transition:border-color 0.2s;">
                                        <div style="width:120px; height:80px; background:linear-gradient(120deg,#fce7f3,#cffafe,#fef9c3,#e9d5ff); border-radius:10px; padding:8px; box-sizing:border-box;">
                                            <div style="height:12px; background:rgba(217,70,239,0.8); border-radius:4px; margin-bottom:6px; backdrop-filter:blur(4px);"></div>
                                            <div style="height:8px; background:rgba(255,255,255,0.65); border-radius:3px; margin-bottom:4px;"></div>
                                            <div style="height:8px; background:rgba(255,255,255,0.65); border-radius:3px; width:70%;"></div>
                                        </div>
                                        <div style="text-align:center; font-size:0.8rem; font-weight:600; padding:4px 0;">🦄 Unicorn</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- View: Dashboard (Karte) -->
                <div id="view-dashboard" style="flex-direction:column; height:100%; gap:0;">

                    <!-- Blütezeit-Slider -->
                    <div id="bloom-slider" style="background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:10px; white-space:nowrap; flex-shrink:0;">
                        <button onclick="setBloomAll()" id="bloom-btn-all" class="c-btn c-btn--primary" style="font-size:0.8rem; padding:5px 12px;">Alle</button>
                        <div style="display:flex; gap:4px;" id="bloom-year-tabs">
                            <button onclick="setBloomYear('std')" data-bloom-year="std" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">Standard</button>
                            <button onclick="setBloomYear(2025)" data-bloom-year="2025" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2025</button>
                            <button onclick="setBloomYear(2026)" data-bloom-year="2026" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2026</button>
                            <button onclick="setBloomYear(2027)" data-bloom-year="2027" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2027</button>
                            <button onclick="setBloomYear(2028)" data-bloom-year="2028" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2028</button>
                            <button onclick="setBloomYear(2029)" data-bloom-year="2029" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2029</button>
                            <button onclick="setBloomYear(2030)" data-bloom-year="2030" class="bloom-year-btn" style="padding:5px 10px; border-radius:20px; border:1px solid var(--border); font-size:0.8rem; cursor:pointer; background:var(--bg-app); color:var(--text-main);">2030</button>
                        </div>
                        <div id="bloom-month-controls" style="display:none; align-items:center; gap:8px;">
                            <button onclick="toggleBloomAutoplay()" id="bloom-autoplay-btn" style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg-app);cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;">▶</button>
                            <select id="bloom-speed-select" onchange="setBloomSpeed(this.value)" style="padding:3px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.75rem;background:var(--bg-app);color:var(--text-main);">
                                <option value="1500">Langsam</option>
                                <option value="800" selected>Normal</option>
                                <option value="300">Schnell</option>
                            </select>
                            <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; min-width:28px;" id="bloom-month-label">Jan</span>
                            <input type="range" min="0" max="11" value="0" id="bloom-month-input"
                                oninput="setBloomMonth(this.value)"
                                style="width:140px; accent-color:var(--primary);">
                        </div>
                    </div>

                    <!-- Karte -->
                    <div class="map" style="flex:1; position:relative; border-radius:0;">
                        <div class="map__canvas" style="width: 100%; height: 100%; overflow: hidden; position: relative; cursor: default;"></div>
                        <div id="map-controls" class="map__controls" style="position: absolute; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px;">
                            <label class="c-btn c-btn--secondary" style="cursor: pointer;">
                                Karte hochladen
                                <input type="file" id="map-upload-input" accept="image/*" style="display: none;">
                            </label>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Galerie -->
    <div id="gallery-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1100; align-items:center; justify-content:center; padding:20px;">
        <div style="background:var(--bg-card); border-radius:var(--radius-lg); width:min(95vw,900px); max-height:90vh; display:flex; flex-direction:column; overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0;">
                <h2 id="gallery-title" style="font-size:1.1rem; font-weight:700; margin:0;"></h2>
                <button class="c-btn c-btn--text" onclick="closeGalleryModal()">✕</button>
            </div>
            <div id="gallery-images-container" style="display:flex; flex-wrap:wrap; gap:16px; padding:24px; overflow-y:auto; justify-content:center;"></div>
        </div>
    </div>

    <!-- Modal: Lightbox (Vollbild) -->
    <div id="full-image-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:1200; align-items:center; justify-content:center; cursor:zoom-out;" onclick="closeFullImage()">
        <button style="position:absolute; top:20px; right:28px; background:none; border:none; color:white; font-size:2.5rem; cursor:pointer; opacity:0.7; line-height:1;" onclick="closeFullImage()">✕</button>
        <img id="full-image-display" src="" alt="" style="max-width:95vw; max-height:95vh; object-fit:contain; border-radius:8px; box-shadow:0 0 60px rgba(0,0,0,0.5);">
    </div>

    <!-- Modal: Pflanze bearbeiten (Rechtsklick) -->
    <div id="modal-pflanze-edit" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1001; align-items:center; justify-content:center;">
        <div class="c-card" style="width:340px;">
            <div class="c-card__header">
                <h2 class="c-card__title" id="modal-edit-title">Pflanze bearbeiten</h2>
                <button class="c-btn c-btn--text" onclick="closePlantEditModal()">✕</button>
            </div>
            <div class="c-card__body">
                <input type="hidden" id="edit-plant-id">
                <div class="c-form-group">
                    <label class="c-label">Marker-Farbe</label>
                    <input type="color" id="edit-marker-color" class="c-input" style="height:42px; padding:4px 8px;">
                </div>
                <div class="c-form-group">
                    <label class="c-label">Marker-Größe (px)</label>
                    <input type="number" id="edit-marker-size" class="c-input" min="10" max="80" placeholder="Standard">
                </div>
                <div class="c-form-group">
                    <label class="c-label">Marker-Icon (Emoji)</label>
                    <input type="text" id="edit-marker-icon" class="c-input" placeholder="z.B. 🌸">
                </div>
            </div>
            <div class="c-card__footer">
                <button class="c-btn c-btn--primary" onclick="savePlantEdit()">Speichern</button>
                <button class="c-btn c-btn--text" onclick="closePlantEditModal()">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Pflanze hinzufügen -->
    <div id="modal-pflanze" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center;">
        <div class="c-card" style="width:460px; max-height:85vh; overflow-y:auto;">
            <div class="c-card__header">
                <h2 class="c-card__title">Pflanze hinzufügen</h2>
                <button class="c-btn c-btn--text" onclick="closeModal()">✕</button>
            </div>
            <div class="c-card__body">
                <div class="c-form-group">
                    <label class="c-label">Pflanzengruppe</label>
                    <select id="modal-group-select" class="c-input" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:var(--radius-md);" onchange="onGroupSelectChange()">
                        <option value="">-- Bitte wählen --</option>
                        <option value="__new__">+ Neue Gruppe anlegen...</option>
                    </select>
                </div>
                <!-- Neue Gruppe → öffnet eigenes Modal -->

            </div>
            <div class="c-card__footer">
                <button id="modal-submit-btn" class="c-btn c-btn--primary" onclick="confirmAddPlant()">Hinzufügen</button>
                <button class="c-btn c-btn--text" onclick="closeModal()">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Neue Pflanzengruppe anlegen -->
    <div id="modal-neue-gruppe" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1002; align-items:center; justify-content:center; padding:20px;">
        <div class="c-card" style="width:min(900px,95vw); max-height:90vh; overflow-y:auto;">
            <div class="c-card__header">
                <h2 class="c-card__title">Neue Pflanzengruppe anlegen</h2>
                <button class="c-btn c-btn--text" onclick="closeNeueGruppeModal()">✕</button>
            </div>
            <div class="c-card__body" id="modal-neue-gruppe-body"></div>
        </div>
    </div>

    <script src="src/js/admin.js"></script>
    <script src="src/js/group-form.js"></script>
    <script src="src/js/app.js"></script>
    <script src="src/js/filter.js"></script>
    <script src="src/js/pflanzen.js"></script>
    <script>
        // Avatar + Rolle laden
        async function loadAvatar() {
            const res = await fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'getAvatar' })
            });
            const data = await res.json();
            if (data.success && data.avatar) {
                document.getElementById('user-avatar').src = data.avatar;
            }
            if (data.role === 'admin') {
                document.getElementById('nav-admin').style.display = 'flex';
            }
        }

        // Avatar Upload
        document.addEventListener('DOMContentLoaded', () => {
            loadAvatar();
            document.getElementById('avatar-upload').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append('action', 'uploadAvatar');
                formData.append('avatar', file);
                const res = await fetch('backend/api.php', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('user-avatar').src = data.avatar + '?t=' + Date.now();
                }
            });
        });

        const views = ['dashboard', 'pflanzen', 'einstellungen', 'admin'];

        function showView(name) {
            views.forEach(v => {
                document.getElementById('view-' + v).style.display = v === name ? (v === 'dashboard' ? 'flex' : 'block') : 'none';
                const btn = document.getElementById('nav-' + v);
                btn.className = 'c-btn ' + (v === name ? 'c-btn--secondary' : 'c-btn--text');
                btn.style.justifyContent = 'flex-start';
            });
            if (name === 'pflanzen') loadPflanzenListe();
            if (name === 'admin') loadAdminView();
            if (name === 'einstellungen') loadEinstellungen();
        }

        async function logout() {
            await fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' })
            });
            location.href = 'login.html';
        }

        async function loadEinstellungen() {
            const res  = await fetch('backend/api.php', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'getUser' }) });
            const data = await res.json();
            if (!data.success) return;
            const u = data.user;
            document.getElementById('settings-username').textContent = u.username || '';
            document.getElementById('settings-email').textContent    = u.email    || '';
            if (u.avatar_path) document.getElementById('settings-avatar').src = u.avatar_path;
            updateSettingsThemeBtn();
        }

        function updateSettingsThemeBtn() {
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            ['light','dark','unicorn'].forEach(t => {
                const el = document.getElementById('theme-opt-' + t);
                if (el) el.style.borderColor = t === theme ? 'var(--primary)' : 'transparent';
            });
        }

        async function settingsSaveProfile() {
            const email    = document.getElementById('settings-new-email').value.trim();
            const password = document.getElementById('settings-new-password').value.trim();
            if (!email && !password) return;
            const res  = await fetch('backend/api.php', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'updateUser', email: email||null, password: password||null }) });
            const data = await res.json();
            if (data.success) {
                document.getElementById('settings-new-password').value = '';
                if (email) { document.getElementById('settings-email').textContent = email; document.getElementById('settings-new-email').value = ''; }
                alert('Gespeichert.');
            }
        }

        async function settingsUploadAvatar(input) {
            const file = input.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('avatar', file);
            fd.append('action', 'uploadAvatar');
            const res  = await fetch('backend/api.php', { method:'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                document.getElementById('settings-avatar').src = data.avatar;
                document.getElementById('user-avatar').src     = data.avatar;
            }
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            updateSettingsThemeBtn();
            fetch('backend/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'saveGardenConfig', theme })
            });
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(current === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>
